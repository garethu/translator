spring.application.name=translator
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/translator
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
spring.mvc.log-request-details=false

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:gemma3:4b}
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.chat.options.num-ctx=8192
spring.ai.ollama.chat.options.num-predict=4096
spring.ai.ollama.chat.options.format=json
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.model.embedding=none

translator.max-concurrent=${TRANSLATOR_MAX_CONCURRENT:1}
translator.connect-timeout=${OLLAMA_CONNECT_TIMEOUT:5s}
translator.read-timeout=${OLLAMA_READ_TIMEOUT:120s}

spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
logging.level.org.springframework.ai=OFF
logging.level.org.springframework.web.client=OFF
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never